<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details | Akash Mahajan</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>
.project-detail-hero{background:linear-gradient(135deg,#21201c,#3a3935,#21201c);color:#fff;padding:120px 0 80px;position:relative}
.project-detail-content{position:relative;z-index:2}
.back-btn{position:fixed;top:100px;left:20px;background:#f53003;color:#fff;padding:1rem;border-radius:50%;z-index:1000}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:2rem;
  margin-top:3rem
}
.feature-card{
  background:#fff;padding:2rem;border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,.1);
  border-left:4px solid #f53003
}

.gallery-container{margin-top:3rem}
.project-gallery{display:flex;overflow:hidden}
.gallery-slide{min-width:100%}
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:2rem;padding:2rem
}
.gallery-item{
  background:linear-gradient(45deg,#f53003,#ff6b3d);
  height:250px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  position:relative;color:#fff
}
.gallery-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 10px;
}
.gallery-item i{font-size:3rem}
</style>
</head>

<body>

<a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

<section class="project-detail-hero">
<div class="container project-detail-content">
  <h1 id="title"></h1>
  <p id="subtitle" style="color:#f53003;font-size:1.3rem"></p>
  <p id="description"></p>
  <div id="techTags" style="display:flex;gap:1rem;flex-wrap:wrap;margin-top:1.5rem"></div>
</div>
</section>

<section style="padding:80px 0;background:#f8f9fa">
<div class="container">
<h2 class="section-title">Project Gallery</h2>
<div class="gallery-container">
  <div class="project-gallery" id="projectGallery"></div>
</div>
</div>
</section>

<section style="padding:80px 0">
<div class="container">
<h2 class="section-title">Key Features</h2>
<div class="feature-grid" id="features"></div>
</div>
</section>

<script src="projects-data.js"></script>
<script>
const key = new URLSearchParams(window.location.search).get("project");
const data = projects[key];

if(!data){document.body.innerHTML="<h2>Project Not Found</h2>";}

document.getElementById("title").innerText=data.title;
document.getElementById("subtitle").innerText=data.subtitle;
document.getElementById("description").innerText=data.description;

document.getElementById("techTags").innerHTML =
  data.tech.map(t=>`<span style="background:rgba(245,48,3,.2);color:#f53003;padding:.5rem 1rem;border-radius:20px">${t}</span>`).join("");

document.getElementById("projectGallery").innerHTML = `
  <div class="gallery-slide">
    <div class="gallery-grid">
      ${data.galleryImages.map(img => `
        <div class="gallery-item">
          <img src="${img}" alt="${data.title}" loading="lazy">
        </div>
      `).join("")}
    </div>
  </div>
`;

document.getElementById("features").innerHTML =
  data.features.map(f=>`
    <div class="feature-card">
      <div style="color:#f53003;font-size:2rem;margin-bottom:1rem"><i class="fas ${f.icon}"></i></div>
      <h3>${f.title}</h3>
      <p>${f.text}</p>
    </div>
  `).join("");
</script>

</body>
</html>
